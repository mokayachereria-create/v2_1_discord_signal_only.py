name: V2.1 London/NY Scanner

on:
  schedule:
    # Run 1: London Session Start (7:00 AM UTC = 10:00 AM Kenya)
    - cron: '0 7 * * 1-5'
    # Run 2: New York Session Start (13:30 UTC = 4:30 PM Kenya)
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Quant Dependencies
        run: pip install alpaca-py pandas numpy yfinance scipy numba requests

      - name: Execute V2.1 Scanner
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python v2_1_discord_signal_only.py
